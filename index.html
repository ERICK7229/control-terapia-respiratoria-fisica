<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control Terapia Respiratoria y Física</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: encabezado + pestañas (Indicadores / Registrar / Registros); tablero en rejilla de tarjetas, formulario en rejilla de campos y fichas */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface2:#F5F9FA; --ink:#12262B; --ink2:#46595F; --muted:#6B7F85; --line:#D8E2E5;
  --resp:#0089A8; --fis:#C2570C; --otro:#7C8F95;
  --accent:#0A6C84; --accent-ink:#FFFFFF; --resp-bg:#DFF2F7; --fis-bg:#FBE8DC;
  --good:#1E7B4B; --good-bg:#E0F2E8; --warn:#9A5B00; --warn-bg:#FBEBCB; --crit:#B3261E; --crit-bg:#FADCD9;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1719; --surface:#142326; --surface2:#1A2D31; --ink:#E5F0F2; --ink2:#A8BDC2; --muted:#8AA2A8; --line:#27393D;
  --resp:#1C9BBA; --fis:#DE6E2E; --otro:#6F878D; --accent:#3AB4CF; --accent-ink:#06181C; --resp-bg:#12353D; --fis-bg:#3A2418;
  --good:#5CC48C; --good-bg:#173A29; --warn:#E5B04F; --warn-bg:#3B2E12; --crit:#FF8A80; --crit-bg:#41201D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1719; --surface:#142326; --surface2:#1A2D31; --ink:#E5F0F2; --ink2:#A8BDC2; --muted:#8AA2A8; --line:#27393D;
  --resp:#1C9BBA; --fis:#DE6E2E; --otro:#6F878D; --accent:#3AB4CF; --accent-ink:#06181C; --resp-bg:#12353D; --fis-bg:#3A2418;
  --good:#5CC48C; --good-bg:#173A29; --warn:#E5B04F; --warn-bg:#3B2E12; --crit:#FF8A80; --crit-bg:#41201D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-body)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.sub{color:var(--ink2);margin:2px 0 0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.off{background:var(--crit)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button:hover{color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.note{font-size:12px;color:var(--muted)}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.filters input,.filters select,.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:36px;min-width:0}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.presets button{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer;min-height:36px}
.presets button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.banner button{background:none;border:1px solid currentColor;border-radius:6px;padding:5px 10px;cursor:pointer;color:inherit}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .lab{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);font-weight:500}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.kpi .val{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .ft{font-size:12px;color:var(--muted)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .lab{font-size:12.5px;color:var(--ink2)}
.tile .val{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .ft{font-size:11.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;width:fit-content}
.pill.ok{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.n{background:var(--surface2);color:var(--ink2)}
.pill.resp{background:var(--resp-bg);color:var(--ink)} .pill.fis{background:var(--fis-bg);color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:12px}

/* tablas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;border-bottom:0}
td.wrapc{white-space:normal;min-width:180px}
details summary{cursor:pointer;color:var(--accent)}
details ul{margin:6px 0 0;padding-left:18px;white-space:normal}

/* barras */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}
.bars{display:grid;grid-template-columns:minmax(90px,170px) 1fr;gap:10px 12px;align-items:center}
.bars .bl{font-size:12.5px;color:var(--ink2);line-height:1.25}
.bars .bg{display:flex;flex-direction:column;gap:2px}
.bar{display:flex;align-items:center;gap:6px;height:14px}
.bar i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.bar b{font-size:11.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
svg text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.hit rect{fill:transparent}
.hit .xh{opacity:0;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.hit:hover .xh{opacity:1}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:6px;font-size:12px;max-width:260px;line-height:1.4}

/* formulario */
.f{display:flex;flex-direction:column;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:500}
.fields .age{display:grid;grid-template-columns:1fr 92px;gap:6px}
.fields .age>*{min-width:0}
.fset{border:0;padding:0;margin:0;min-width:0}
.fset legend{padding:0;margin-bottom:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 12px;min-height:38px;cursor:pointer;font-size:13px}
.chip span::before{content:"";width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px;flex:none}
.chip:has(input:checked) span{background:var(--resp-bg);border-color:var(--resp);font-weight:500}
.chip[data-t="fis"]:has(input:checked) span{background:var(--fis-bg);border-color:var(--fis)}
.chip[data-t="otro"]:has(input:checked) span{background:var(--surface);border-color:var(--ink2)}
.chip:has(input:checked) span::before{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.chip:has(input:focus-visible) span{outline:2px solid var(--accent);outline-offset:2px}
.o2{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:500;margin-top:10px;max-width:320px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 20px;font-weight:600;cursor:pointer;min-height:42px}
.btn.sec2{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px}
.msg.err{color:var(--crit)} .msg.okk{color:var(--good)}
.del{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink2)}
.del.arm{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)}
.empty{color:var(--muted);padding:24px 8px;text-align:center}
[data-view][hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;gap:16px}
html{background:var(--bg)}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Control de Terapia Respiratoria y Física</h1>
      <p class="sub">Atenciones por servicio, registro por paciente e indicadores</p>
    </div>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Conectando…</span><button class="btn sec2" type="button" id="logoutBtn" hidden style="min-height:32px;padding:4px 12px;margin-left:8px">Salir</button></div>
  </header>

  <section id="auth" class="card" hidden style="max-width:420px;margin:24px auto;width:100%">
    <h2>Ingresar</h2>
    <p class="note" id="authNote">Usa el correo y la contraseña que te entregó la jefe.</p>
    <form id="loginForm" class="f" style="margin-top:12px">
      <div class="fields" style="grid-template-columns:1fr">
        <label>Correo<input type="email" id="l-email" required autocomplete="username"></label>
        <label>Contraseña<input type="password" id="l-pass" required autocomplete="current-password"></label>
      </div>
      <div class="actions"><button class="btn" type="submit" id="loginBtn">Entrar</button><span class="msg" id="loginMsg" role="status"></span></div>
    </form>
  </section>

  <div id="app" hidden>

  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" id="t-indicadores" data-go="indicadores">Indicadores</button>
    <button role="tab" id="t-registrar" data-go="registrar">Registrar atención</button>
    <button role="tab" id="t-registros" data-go="registros">Registros</button>
  </nav>

  <div id="filtersHost"></div>

  <section data-view="indicadores" class="sec" aria-labelledby="t-indicadores" id="v-indicadores"></section>

  <section data-view="registrar" hidden aria-labelledby="t-registrar" id="v-registrar">
    <form class="card f" id="form" autocomplete="off">
      <div class="cardhead"><h2>Nueva atención</h2><span class="note">Un registro por paciente, por día y por terapeuta.</span></div>
      <div class="fields">
        <label>Servicio
          <select id="f-servicio" required></select>
        </label>
        <label>Fecha
          <input type="date" id="f-fecha" required>
        </label>
        <label>Terapeuta
          <input type="text" id="f-terapeuta" placeholder="Nombre del terapeuta" required>
        </label>
        <label>Paciente
          <input type="text" id="f-paciente" placeholder="Nombre completo" required>
        </label>
        <label>Historia clínica
          <input type="text" id="f-hc" inputmode="numeric" placeholder="N.º de historia" required>
        </label>
        <label>Edad
          <span class="age">
            <input type="number" id="f-edad" min="0" max="120" inputmode="numeric" required>
            <select id="f-unidad" aria-label="Unidad de edad"><option>años</option><option>meses</option><option>días</option></select>
          </span>
        </label>
        <label>Género
          <select id="f-genero" required><option value="">Elegir…</option><option>Femenino</option><option>Masculino</option><option>Otro</option></select>
        </label>
      </div>
      <div id="checklist"></div>
      <label class="fields" style="display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:500">Observaciones (opcional)
        <textarea id="f-obs" rows="2" style="resize:vertical"></textarea>
      </label>
      <div class="actions">
        <button class="btn" type="submit" id="saveBtn">Guardar atención</button>
        <button class="btn sec2" type="button" id="clearBtn">Limpiar</button>
        <span id="typeBadge" style="display:flex;gap:6px"></span>
        <span class="msg" id="formMsg" role="status"></span>
      </div>
    </form>
  </section>

  <section data-view="registros" hidden aria-labelledby="t-registros" id="v-registros"></section>
  </div>
</div>
<div id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ============ Catálogo ============ */
const SERVICES=[
 {k:'ucicv',n:'UCI Cardiovascular',g:'uci'},
 {k:'uciicv',n:'UCI Intermedios Cardiovascular',g:'uci'},
 {k:'ucin',n:'UCI Neurológica',g:'uci'},
 {k:'uciin',n:'UCI Intermedio Neurológica',g:'uci'},
 {k:'ucip',n:'UCI Pediátrica y Mezzanine',g:'uci'},
 {k:'hosp',n:'Hospitalización',g:'piso'},
 {k:'prio',n:'Prioritaria',g:'piso'}];
const SVC=Object.fromEntries(SERVICES.map(s=>[s.k,s]));
/* t: resp = terapia respiratoria · fis = terapia física · otro = no cuenta como tipo de terapia */
const ITEMS={
 gases:['Gases A-V','resp'], consentimiento:['Consentimiento','otro'], oxigenoterapia:['Oxigenoterapia','resp'],
 inhaloterapia:['Inhaloterapia','resp'], aerosolterapia:['Aerosolterapia','resp'], espirometria:['Espirometría','resp'],
 terapia_fisica:['Terapia física','fis'], tr_succion:['Terapia respiratoria (succión)','resp'],
 tr_incentivo:['Terapia respiratoria + incentivo respiratorio','resp'], proc_tqt:['Procedimientos TQT','resp'],
 asist_tqt:['Asistencia TQT','resp'], reanimacion:['Reanimación','resp'], toma_muestras:['Toma de muestras respiratorias','resp'],
 fibro:['Fibrobroncoscopia','resp'], toracostomia:['Toracostomía','resp'], pronacion:['Pronación','resp'],
 intubacion:['Intubación / canulación','resp'], decanulacion:['Decanulación','resp'],
 vmi:['VMI','resp'], vmni:['VMNI','resp'], cnaf:['CNAF','resp'], cpap:['CPAP / nocturno','resp'], oxido_nitrico:['Óxido nítrico','resp'],
 extub_prog:['Extubación programada','resp'], extub_fallida:['Extubación fallida (reintubación antes de 24 h)','resp'],
 autoextub:['Autoextubación','resp'], extub_lista:['Extubación con lista de chequeo','resp'],
 traslado:['Traslado de paciente','otro'], fallece:['Paciente fallece','otro'], a_piso:['Paciente trasladado a piso','otro'],
 a_estudios:['Paciente trasladado a estudios','otro'], remitido:['Paciente remitido','otro'],
 traqueitis:['Paciente con diagnóstico de traqueítis','otro'], navm:['Paciente con diagnóstico de NAVM','otro'],
 lista_navm:['Lista de chequeo de NAVM','otro'], lesiones_piel:['Lesiones de piel por dispositivos','otro']};
const G_UCI=[
 ['Oxigenación y terapia',['gases','oxigenoterapia','inhaloterapia','aerosolterapia','tr_succion','tr_incentivo','toma_muestras']],
 ['Terapia física',['terapia_fisica']],
 ['Procedimientos',['proc_tqt','asist_tqt','reanimacion','fibro','toracostomia','pronacion','intubacion']],
 ['Soporte ventilatorio',['vmi','vmni','cnaf','oxido_nitrico']],
 ['Extubación',['extub_prog','extub_fallida','autoextub','extub_lista']],
 ['Traslado y desenlace',['traslado','fallece','a_piso','a_estudios','remitido']],
 ['Calidad y seguridad',['traqueitis','navm','lista_navm','lesiones_piel']],
 ['Documentación',['consentimiento']]];
const G_PISO=[
 ['Oxigenación y terapia',['gases','oxigenoterapia','inhaloterapia','aerosolterapia','espirometria','tr_succion','tr_incentivo','toma_muestras']],
 ['Terapia física',['terapia_fisica']],
 ['Procedimientos',['proc_tqt','reanimacion','decanulacion']],
 ['Soporte ventilatorio',['vmi','vmni','cnaf','cpap']],
 ['Traslado y desenlace',['traslado','fallece','remitido']],
 ['Documentación',['consentimiento']]];
const groupsFor=k=>SVC[k]?.g==='piso'?G_PISO:G_UCI;
const O2=['Cánula nasal','Venturi','Máscara de no reinhalación','Máscara simple','CPAP'];

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const fmtD=s=>{if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const fmtShort=s=>{const[,m,d]=s.split('-');return d+'/'+m};
const nf=n=>n.toLocaleString('es-CO');
const pct=(a,b)=>b?Math.round(a/b*1000)/10:null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};

/* ============ Estado ============ */
let sb=null, session=null, recs=[], loaded=false, dbError=null, isAdmin=false, channel=null;
let demoHidden=false;
const F={preset:'30',from:addDays(today(),-29),to:today(),svc:'all',ter:'all'};
const form={items:new Set(),o2:''};

function prep(r){
  const items=new Set(Array.isArray(r.items)?r.items:[]);
  let resp=false,fis=false;
  items.forEach(k=>{const t=ITEMS[k]?.[1];if(t==='resp')resp=true;if(t==='fis')fis=true});
  return {...r,_items:items,_resp:resp,_fis:fis,_pid:String(r.hc||r.paciente||'').trim().toLowerCase()||r.id};
}

/* ============ Datos de ejemplo (solo en pantalla, no se guardan) ============ */
function demoData(){
  let s=20261105;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const ters=['Terapeuta 1','Terapeuta 2','Terapeuta 3','Terapeuta 4'];
  const P={vmi:.22,vmni:.1,cnaf:.14,gases:.3,oxigenoterapia:.3,inhaloterapia:.2,aerosolterapia:.2,tr_succion:.45,tr_incentivo:.25,toma_muestras:.1,
    terapia_fisica:.55,consentimiento:.12,proc_tqt:.06,asist_tqt:.05,reanimacion:.015,fibro:.03,toracostomia:.02,pronacion:.04,intubacion:.04,oxido_nitrico:.015,
    extub_prog:.06,extub_fallida:.008,autoextub:.006,extub_lista:.05,traslado:.07,fallece:.012,a_piso:.05,a_estudios:.04,remitido:.015,
    traqueitis:.006,navm:.006,lista_navm:.12,lesiones_piel:.01,espirometria:.07,decanulacion:.03,cpap:.06};
  const out=[];let id=0;
  for(let d=0;d<30;d++){const fecha=addDays(today(),-d);
    SERVICES.forEach((sv,si)=>{const n=2+Math.floor(rnd()*5);
      for(let i=0;i<n;i++){const pat=Math.floor(rnd()*9);
        const items=[];groupsFor(sv.k).forEach(([,ks])=>ks.forEach(k=>{if(rnd()<(P[k]||.05))items.push(k)}));
        if(!items.length)items.push(rnd()<.5?'terapia_fisica':'tr_succion');
        out.push({id:'demo'+(id++),fecha,servicio:sv.k,paciente:'Paciente '+(si+1)+'0'+pat,hc:'9'+si+'00'+pat,edad:20+pat*7,unidad:'años',genero:pat%2?'Femenino':'Masculino',terapeuta:ters[Math.floor(rnd()*4)],items,o2:items.includes('oxigenoterapia')?O2[Math.floor(rnd()*5)]:''});}});}
  return out;
}

function bindDemo(){const b=$('#hideDemo');if(b)b.onclick=()=>{demoHidden=true;renderAll()}}

let trendNoteTxt='';
function weekStart(s){const d=new Date(s+'T00:00:00');const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)}
function trendChart(rs){
  const dates=rs.map(r=>r.fecha).sort();
  const from=F.from||dates[0], to=F.to||dates[dates.length-1];
  const days=Math.round((new Date(to)-new Date(from))/864e5)+1;
  const weekly=days>45;
  const keyOf=weekly?weekStart:(s=>s);
  const buckets=[];const idx={};
  let cur=weekly?weekStart(from):from;
  while(cur<=to){idx[cur]=buckets.length;buckets.push({k:cur,resp:0,fis:0});cur=addDays(cur,weekly?7:1)}
  rs.forEach(r=>{const b=buckets[idx[keyOf(r.fecha)]];if(!b)return;if(r._resp)b.resp++;if(r._fis)b.fis++});
  trendNoteTxt=weekly?'Atenciones por semana (inicio lunes)':'Atenciones por día';
  const W=680,H=240,L=34,R=16,T=14,B=28,pw=W-L-R,ph=H-T-B,n=buckets.length;
  const ymax0=Math.max(1,...buckets.flatMap(b=>[b.resp,b.fis]));
  const step=[1,2,5,10,20,25,50,100,200,250,500,1000,5000].find(s=>ymax0/s<=5)||10000;
  const ymax=Math.ceil(ymax0/step)*step;
  const X=i=>L+(n===1?pw/2:i*pw/(n-1)), Y=v=>T+ph-v/ymax*ph;
  let g='';
  for(let v=0;v<=ymax;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  const every=Math.max(1,Math.ceil(n/7));
  buckets.forEach((b,i)=>{if(i%every===0||i===n-1&&n<=7)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${fmtShort(b.k)}</text>`});
  const line=(key,color)=>{
    const pts=buckets.map((b,i)=>[X(i),Y(b[key])]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=n>1?`<path d="${d} L${X(n-1)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="${color}" opacity=".10"/>`:'';
    const last=pts[n-1];
    return `${area}<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
  };
  g+=line('resp','var(--resp)')+line('fis','var(--fis)');
  const hw=n===1?pw:pw/(n-1);
  buckets.forEach((b,i)=>{
    const lab=weekly?'Semana del '+fmtD(b.k):fmtD(b.k);
    g+=`<g class="hit"><line class="xh" x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${T+ph}"/><rect x="${X(i)-hw/2}" y="${T}" width="${hw}" height="${ph}" data-tip="<b>${lab}</b><br>Respiratoria: ${b.resp}<br>Física: ${b.fis}"/></g>`;
  });
  return `<div class="legend"><span><i class="sw" style="background:var(--resp)"></i>Respiratoria</span><span><i class="sw" style="background:var(--fis)"></i>Física</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Atenciones de terapia respiratoria y física a lo largo del periodo" style="display:block;max-width:100%;height:auto">${g}</svg>`;
}

  const d=e.target.closest('[data-del]');

function alert_msg(t){$('#syncTxt').textContent=t}
function exportCsv(){
  const rs=filtered().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const keys=Object.keys(ITEMS);
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['Fecha','Servicio','Paciente','Historia clinica','Edad','Unidad','Genero','Terapeuta','Terapia respiratoria','Terapia fisica',...keys.map(k=>ITEMS[k][0]),'Dispositivo oxigenoterapia','Observaciones'];
  const lines=[head.map(q).join(',')].concat(rs.map(r=>[r.fecha,SVC[r.servicio]?.n||r.servicio,r.paciente,r.hc,r.edad,r.unidad,r.genero,r.terapeuta,r._resp?1:0,r._fis?1:0,...keys.map(k=>r._items.has(k)?1:0),r.o2,r.obs].map(q).join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atenciones_terapia_'+today()+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

}
function updateBadge(){
  let resp=false,fis=false;form.items.forEach(k=>{const t=ITEMS[k]?.[1];if(t==='resp')resp=true;if(t==='fis')fis=true});
  $('#typeBadge').innerHTML=(resp?'<span class="pill resp">Cuenta como terapia respiratoria</span>':'')+(fis?'<span class="pill fis">Cuenta como terapia física</span>':'');
}
document.addEventListener('change',e=>{
  if(e.target.id==='f-servicio'){renderChecklist();return}
  if(e.target.id==='f-o2'){form.o2=e.target.value;return}
  const k=e.target.dataset&&e.target.dataset.item;
  if(k){e.target.checked?form.items.add(k):form.items.delete(k);updateBadge();if(k==='oxigenoterapia'){const w=$('#o2wrap');if(w)w.hidden=!e.target.checked}}
});
function clearPatient(){
  ['f-paciente','f-hc','f-edad','f-obs'].forEach(i=>$('#'+i).value='');
  $('#f-genero').value='';form.items.clear();form.o2='';renderChecklist();
}
$('#clearBtn').onclick=()=>{clearPatient();$('#formMsg').textContent=''};
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();
  const m=$('#formMsg');const set=(t,c)=>{m.textContent=t;m.className='msg '+c};
  if(!sb||!session)return set('Tu sesión terminó. Vuelve a ingresar.','err');
  const v=i=>$('#'+i).value.trim();
  if(!v('f-servicio')||!v('f-fecha')||!v('f-terapeuta')||!v('f-paciente')||!v('f-hc')||v('f-edad')===''||!v('f-genero'))return set('Completa servicio, fecha, terapeuta, paciente, historia clínica, edad y género.','err');
  if(!form.items.size)return set('Marca al menos un ítem.','err');
  if(form.items.has('oxigenoterapia')&&!form.o2)return set('Elige el dispositivo de oxigenoterapia.','err');
  const btn=$('#saveBtn');btn.disabled=true;
  const data={fecha:v('f-fecha'),servicio:v('f-servicio'),paciente:v('f-paciente'),hc:v('f-hc'),edad:Number(v('f-edad')),unidad:v('f-unidad'),genero:v('f-genero'),terapeuta:v('f-terapeuta'),items:[...form.items],o2:form.items.has('oxigenoterapia')?form.o2:'',obs:v('f-obs')};
  try{
    const {error}=await sb.from('atenciones').insert(data);
    if(error)throw error;
    lsSet('terapeuta',data.terapeuta);
    set('Guardado: '+data.paciente+' · '+(SVC[data.servicio].n)+'.','okk');
    clearPatient();$('#f-paciente').focus();
  }catch(err){
    set('No se pudo guardar. Intenta de nuevo. '+(err.message||''),'err');
  }finally{btn.disabled=false}
});

/* ============ Vistas ============ */
let view='indicadores';
function go(v,push){
  view=!isAdmin?'registrar':(['indicadores','registrar','registros'].includes(v)?v:'indicadores');
  document.querySelectorAll('[data-view]').forEach(s=>s.hidden=s.dataset.view!==view);
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.go===view));
  if(push)history.replaceState(null,'','#'+view);
  renderAll();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.go,true));
addEventListener('hashchange',()=>go(location.hash.slice(1)));
function renderAll(){
  renderFilters();
  if(view==='indicadores')renderDash();
  else if(view==='registros')renderRegs();
}
function setSync(){
  const d=$('#dot'),t=$('#syncTxt');
  if(!sb||!session){d.className='dot off';t.textContent='Sin sesión';return}
  if(dbError){d.className='dot off';t.textContent='Error de conexión';return}
  if(!loaded){d.className='dot';t.textContent='Conectando…';return}
  d.className='dot on';t.textContent=isAdmin?nf(recs.length)+' atenciones guardadas':'Sesión de registro';
}

/* ============ Arranque ============ */
fillServices();
$('#f-fecha').value=today();
$('#f-terapeuta').value=lsGet('terapeuta')||'';
renderChecklist();
const cfg=window.APP_CONFIG||{};
const mapRow=r=>({...r,creado:Date.parse(r.creado)||0});
function showLogin(msg){
  $('#auth').hidden=false;$('#app').hidden=true;$('#logoutBtn').hidden=true;
  $('#loginMsg').textContent=msg||'';setSync();
}
async function loadAll(){
  recs=[];loaded=false;dbError=null;setSync();renderAll();
  let from=0;const size=1000;
  for(;;){
    const {data,error}=await sb.from('atenciones').select('*').order('creado',{ascending:false}).range(from,from+size-1);
    if(error){dbError=error;break}
    recs.push(...data.map(mapRow));
    if(data.length<size)break;from+=size;
  }
  loaded=true;setSync();renderAll();
  channel=sb.channel('atenciones-live').on('postgres_changes',{event:'*',schema:'public',table:'atenciones'},p=>{
    if(p.eventType==='INSERT'){if(!recs.some(x=>x.id===p.new.id))recs.unshift(mapRow(p.new))}
    else if(p.eventType==='UPDATE'){recs=recs.map(x=>x.id===p.new.id?mapRow(p.new):x)}
    else if(p.eventType==='DELETE'){recs=recs.filter(x=>x.id!==p.old.id)}
    setSync();renderAll();
  }).subscribe();
}
async function onSession(s){
  session=s;
  if(channel){sb.removeChannel(channel);channel=null}
  recs=[];isAdmin=false;loaded=false;
  if(!s){document.querySelector('nav.tabs').hidden=true;go('registrar');showLogin();return}
  $('#auth').hidden=true;$('#app').hidden=false;$('#logoutBtn').hidden=false;
  const {data:prof}=await sb.from('profiles').select('rol,nombre').eq('id',s.user.id).maybeSingle();
  isAdmin=prof?.rol==='jefe';
  if(prof?.nombre&&!$('#f-terapeuta').value)$('#f-terapeuta').value=prof.nombre;
  document.querySelector('nav.tabs').hidden=!isAdmin;
  loaded=true;setSync();
  go(isAdmin?(location.hash.slice(1)||'indicadores'):'registrar');
  if(isAdmin)loadAll();
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=$('#loginBtn');b.disabled=true;$('#loginMsg').className='msg';$('#loginMsg').textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#l-email').value.trim(),password:$('#l-pass').value});
  b.disabled=false;
  if(error){$('#loginMsg').className='msg err';$('#loginMsg').textContent='Correo o contraseña incorrectos.';return}
  $('#l-pass').value='';$('#loginMsg').textContent='';
  onSession(data.session);
});
$('#logoutBtn').onclick=()=>sb.auth.signOut();
(async()=>{
  document.querySelector('nav.tabs').hidden=true;go('registrar');
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){
    $('#auth').hidden=false;$('#loginForm').hidden=true;
    $('#authNote').textContent='Falta configurar la base de datos. Completa SUPABASE_URL y SUPABASE_ANON_KEY en config.js.';return}
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')onSession(null)});
  const {data}=await sb.auth.getSession();
  onSession(data.session);
})();
</script>
</body></html>
